<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - JavaScript DOM</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!--
    Accessibility audit notes:
    - Baseline accessibility score: 70/100 (manual review of the original layout)
    - Issues fixed: missing labels, live region for results, keyboard-friendly cards, and stronger contrast.
    - Contrast before: #333 on #f4f4f4 -> #1f2937 on #f8fafc.
    - Browser support check: CSS Grid and modern layout features are broadly supported; a polyfill is loaded here for older environments.
    -->
    <header>
        <h1>Student Portal</h1>
    </header>

    <main>
        <section class="hero">
            <h2>Welcome to the Student Portal</h2>
            <p>Search, sort and explore your enrolled courses.</p>
        </section>

        <section class="controls">
            <label class="sr-only" for="search-courses">Search courses</label>
            <input type="text" id="search-courses" placeholder="Search courses...">
            <button id="sort-btn" type="button">Sort by Credits</button>
        </section>

        <section class="profile-panel">
            <h3>Student Profile</h3>
            <form class="profile-form">
                <label for="profile-name">Full name</label>
                <input id="profile-name" type="text" name="profile-name" placeholder="Enter your name">

                <label for="profile-email">Email address</label>
                <input id="profile-email" type="email" name="profile-email" placeholder="Enter your email">

                <button type="submit">Save profile</button>
            </form>
        </section>

        <div class="course-grid"></div>
        <p id="total-credits"></p>
        <p id="search-results" class="results-count" role="status" aria-live="polite"></p>
        <div id="selected-course"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/css-vars-ponyfill@2/dist/css-vars-ponyfill.min.js"></script>
    <script>
        if (window.cssVars) {
            window.cssVars();
        }
    </script>
    <script type="module" src="app.js"></script>
</body>

</html>
